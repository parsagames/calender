name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Pillow
        run: pip install pillow --break-system-packages

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy icon to Android resources
        run: |
          python3 -c "
          from PIL import Image
          import os
          sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192,
          }
          img = Image.open('icon.png').convert('RGBA')
          for folder, size in sizes.items():
            path = f'android/app/src/main/res/{folder}'
            os.makedirs(path, exist_ok=True)
            r = img.resize((size, size), Image.LANCZOS)
            r.save(f'{path}/ic_launcher.png', 'PNG')
            r.save(f'{path}/ic_launcher_round.png', 'PNG')
            r.save(f'{path}/ic_launcher_foreground.png', 'PNG')
          print('Icons copied!')
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set app label in strings.xml
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">تقویم شیعه امیرالمومنین</string>|' \
            android/app/src/main/res/values/strings.xml || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiralmomenin-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "تقویم شیعه امیرالمومنین - نسخه ${{ github.run_number }}"
          body: "نسخه تست"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
